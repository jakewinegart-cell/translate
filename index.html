<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Say — fast translations with Egyptian Arabic (مصري) focus." />
  <title>Say — Translate · Egyptian Arabic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=say3" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">س</div>
        <div class="brand-text">
          <h1>Say</h1>
          <p class="subtitle">Translate · Egyptian Arabic (مصري) first</p>
        </div>
      </div>
    </header>

    <section class="pairs" aria-label="Language pairs">
      <div class="pairs-label">
        <span>Language pair</span>
        <span class="badge-featured">Egyptian Arabic featured</span>
      </div>
      <div class="pair-chips" role="listbox" aria-label="Select language pair" id="pairChips">
        <!-- filled by JS -->
      </div>
    </section>

    <section class="lang-bar" aria-label="Source and target languages">
      <button type="button" class="lang-btn" id="sourceLangBtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="lang-role">From</span>
        <span class="lang-name" id="sourceLangName">English</span>
        <span class="lang-code" id="sourceLangCode">en</span>
      </button>
      <button type="button" class="swap-btn" id="swapBtn" aria-label="Swap languages" title="Swap languages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 16V4M7 4L3 8M7 4l4 4"/>
          <path d="M17 8v12M17 20l4-4M17 20l-4-4"/>
        </svg>
      </button>
      <button type="button" class="lang-btn" id="targetLangBtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="lang-role">To</span>
        <span class="lang-name" id="targetLangName">Egyptian Arabic</span>
        <span class="lang-code" id="targetLangCode">ar-EG</span>
      </button>
    </section>

    <!-- Language picker dropdown (shared) -->
    <div class="lang-menu hidden" id="langMenu" role="listbox" hidden></div>

    <section class="voice-bar" aria-label="Voice controls">
      <button type="button" class="voice-btn voice-mic" id="micBtnMain" aria-label="Microphone — speak to type">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>
        </svg>
        <span class="voice-btn-text">
          <strong>Mic</strong>
          <small>Speak to type</small>
        </span>
      </button>
      <button type="button" class="voice-btn voice-speak" id="speakBtnMain" aria-label="Speak — hear translation aloud">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>
        </svg>
        <span class="voice-btn-text">
          <strong>Speak</strong>
          <small>Hear translation</small>
        </span>
      </button>
    </section>
    <p class="voice-hint hidden" id="voiceHint" role="status" aria-live="polite"></p>

    <main class="main">
      <section class="card input-card">
        <div class="card-toolbar">
          <span class="card-label" id="inputLabel">English</span>
          <div class="toolbar-actions">
            <button type="button" class="icon-btn voice-icon" id="micBtn" aria-label="Microphone — speak to type" title="Mic — speak to type">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>
              </svg>
              <span>Mic</span>
            </button>
            <button type="button" class="icon-btn" id="cameraBtn" aria-label="Camera or upload image for OCR" title="Camera / OCR">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <span>Camera</span>
            </button>
            <input type="file" id="imageInput" accept="image/*" capture="environment" hidden />
            <button type="button" class="icon-btn ghost" id="clearBtn" aria-label="Clear input" title="Clear">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </div>
        <textarea id="inputText" class="text-area" rows="4" placeholder="Type or paste text to translate…" autocomplete="off" spellcheck="true"></textarea>
        <div class="mic-status hidden" id="micStatus" aria-live="polite">
          <span class="pulse"></span>
          <span>Listening…</span>
        </div>
        <div class="ocr-status hidden" id="ocrStatus" aria-live="polite"></div>
        <div class="card-footer">
          <span class="char-count" id="charCount">0</span>
          <button type="button" class="primary-btn" id="translateBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 8l6 6M5 8l6-6M5 8h10a4 4 0 0 1 0 8h-2"/>
              <path d="M13 16l6 6M19 16l-6 6"/>
            </svg>
            Translate
          </button>
        </div>
      </section>

      <section class="card output-card">
        <div class="card-toolbar">
          <span class="card-label" id="outputLabel">Egyptian Arabic · مصري</span>
          <div class="toolbar-actions">
            <button type="button" class="icon-btn voice-icon" id="speakBtn" aria-label="Speak — hear translation aloud" title="Speak — hear translation">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>
              </svg>
              <span>Speak</span>
            </button>
            <button type="button" class="icon-btn ghost" id="copyBtn" aria-label="Copy translation" title="Copy">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
        <div id="outputText" class="output-area" aria-live="polite" role="status">
          <span class="placeholder">Translation appears here</span>
        </div>
        <div class="demo-note hidden" id="demoNote"></div>
        <div class="speak-status hidden" id="speakStatus" aria-live="polite">
          <span class="wave"></span>
          <span>Speaking…</span>
        </div>
      </section>

      <section class="history" aria-label="Recent translations">
        <div class="history-header">
          <h2>Recent</h2>
          <button type="button" class="link-btn" id="clearHistoryBtn">Clear</button>
        </div>
        <ul class="history-list" id="historyList">
          <li class="history-empty">No translations yet — try “hello” or “thank you”</li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>Say · Egyptian Arabic via MyMemory <code>arz</code> · Web Speech · Tesseract OCR</p>
    </footer>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=say3"></script>
</body>
</html>
